[package]
name = "tracing-example"
version = "0.1.0"
edition = "2021"

[dependencies]
cloudevents-sdk = { version = "0.9.0", path = "../.." }
opentelemetry = { version = "0.33.1", optional = true }
opentelemetry_sdk = { version = "0.33.1", optional = true }
serde_json = "1"
tracing = { version = "0.1.44", optional = true }
tracing-opentelemetry = { version = "0.34.0", optional = true }
tracing-subscriber = { version = "0.3.22", optional = true }

[features]
tracing = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:tracing", "dep:tracing-opentelemetry", "dep:tracing-subscriber"]

[[bin]]
name = "tracing-example"
path = "src/main.rs"
required-features = ["tracing"]
