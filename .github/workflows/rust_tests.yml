name: Rust Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    name: ${{ matrix.toolchain }} / ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - stable
          - nightly
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - wasm32-unknown-unknown
          - wasm32-wasip1
    steps:
    - uses: actions/checkout@v7

    # setup wasmedge
    - run: curl -sSf https://raw.githubusercontent.com/WasmEdge/WasmEdge/master/utils/install.sh | sudo bash -s -- -p /usr/local
    # Install native librdkafka build dependencies on Linux
    - run: sudo apt-get update
      if: startsWith(matrix.target, 'x86_64-unknown-linux-')
    - run: sudo apt-get install -y libcurl4-openssl-dev libsasl2-dev
      if: startsWith(matrix.target, 'x86_64-unknown-linux-')
    # Setup musl if needed
    - run: sudo apt-get install -y musl musl-dev musl-tools cmake
      if: matrix.target == 'x86_64-unknown-linux-musl'
    # # Caching stuff
    - uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        key: ${{ runner.os }}-cargo-deps-${{ hashFiles('**/Cargo.toml') }}
    - uses: actions/cache@v5
      with:
        path: |
          target/
        key: ${{ runner.os }}-cargo-target-${{ matrix.toolchain }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.toml') }}
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.toolchain }}
        targets: ${{ matrix.target }}

    # If glibc, compile and test all
    - name: "Build"
      if: matrix.target == 'x86_64-unknown-linux-gnu'
      run: cargo build --target ${{ matrix.target }} --all-features
    - name: "Test"
      if: matrix.target == 'x86_64-unknown-linux-gnu'
      run: cargo test --target ${{ matrix.target }} --all-features

    # If musl, compile and test all
    - name: "Build"
      if: matrix.target == 'x86_64-unknown-linux-musl'
      run: cargo build --target ${{ matrix.target }} --all-features
      env:
        CC: musl-gcc
        CXX: g++
    - name: "Test"
      if: matrix.target == 'x86_64-unknown-linux-musl'
      run: cargo test --target ${{ matrix.target }} --all-features
      env:
        CC: musl-gcc
        CXX: g++

    - name: "Build"
      if: matrix.target == 'wasm32-unknown-unknown'
      run: cargo build --target wasm32-unknown-unknown --features reqwest
    - name: "Build"
      if: matrix.target == 'wasm32-wasi'
      run: cargo build --target ${{ matrix.target }} --features "http-0-2-binding hyper-0-14 hyper_wasi"
    - name: "Test"
      if: matrix.target == 'wasm32-wasi'
      run: cargo test --target ${{ matrix.target }} --features "http-0-2-binding hyper-0-14 hyper_wasi"
      env:
        CARGO_TARGET_WASM32_WASI_RUNNER: wasmedge
    # Build examples
    - name: "Build wasi-example"
      if: matrix.target == 'wasm32-wasi' && matrix.toolchain == 'stable'
      run: cargo build --target ${{ matrix.target }} --manifest-path ./example-projects/wasi-example/Cargo.toml

    - name: "Build reqwest-wasm-example"
      if: matrix.target == 'wasm32-unknown-unknown' && matrix.toolchain == 'stable'
      run: cargo build --target ${{ matrix.target }} --manifest-path ./example-projects/reqwest-wasm-example/Cargo.toml

    - name: "Build rdkafka-example"
      if: matrix.target == 'x86_64-unknown-linux-gnu' && matrix.toolchain == 'stable'
      run: cargo build --target ${{ matrix.target }} --manifest-path ./example-projects/rdkafka-example/Cargo.toml

    - name: "Build actix-web-example"
      if: matrix.target == 'x86_64-unknown-linux-gnu' && matrix.toolchain == 'stable'
      run: cargo build --target ${{ matrix.target }} --manifest-path ./example-projects/actix-web-example/Cargo.toml

    - name: "Build warp-example"
      if: matrix.target == 'x86_64-unknown-linux-gnu' && matrix.toolchain == 'stable'
      run: cargo build --target ${{ matrix.target }} --manifest-path ./example-projects/warp-example/Cargo.toml

    - name: "Build axum-example"
      if: matrix.target == 'x86_64-unknown-linux-gnu' && matrix.toolchain == 'stable'
      run: cargo build --target ${{ matrix.target }} --manifest-path ./example-projects/axum-example/Cargo.toml

    - name: "Build poem-example"
      if: matrix.target == 'x86_64-unknown-linux-gnu' && matrix.toolchain == 'stable'
      run: cargo build --target ${{ matrix.target }} --manifest-path ./example-projects/poem-example/Cargo.toml

    - name: "Build nats-example"
      if: matrix.target == 'x86_64-unknown-linux-gnu' && matrix.toolchain == 'stable'
      run: cargo build --target ${{ matrix.target }} --manifest-path ./example-projects/nats-example/Cargo.toml
